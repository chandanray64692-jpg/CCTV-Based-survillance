{% extends 'core/base.html' %}
{% block page_label %}REST API INTEGRATIONS{% endblock %}

{% block content %}
<div class="h-full flex flex-col gap-2 min-h-0">
    <div class="bg-vms_card border border-vms_border rounded p-2 flex justify-between items-center shrink-0">
        <div class="text-[9px] font-bold text-slate-300 tracking-widest uppercase">System Endpoints</div>
        <div class="text-[7px] text-emerald-400 bg-emerald-900/20 border border-emerald-800/50 px-2 py-0.5 rounded font-mono animate-pulse tracking-widest">
            API GATEWAY ACTIVE
        </div>
    </div>

    <div class="flex-1 overflow-y-auto custom-scrollbar space-y-1.5 pr-1 min-h-0">
        {% for ep in endpoints %}
        <div class="bg-[#050a12] border border-vms_border p-2 rounded flex justify-between items-center hover:border-blue-500/30 transition group">
            <div>
                <div class="text-[9px] font-bold text-cyan-300 mb-0.5">{{ ep.name|upper }}</div>
                <div class="text-[7px] text-slate-500 font-mono select-all">{{ ep.url }}</div>
            </div>
            <div class="text-[6px] font-bold tracking-widest px-1.5 py-0.5 rounded border border-blue-500/30 bg-blue-500/10 text-blue-400 shrink-0">
                {{ ep.method }}
            </div>
        </div>
        {% empty %}
        <div class="flex items-center justify-center h-full text-[8px] text-slate-600 font-mono">No API endpoints documented.</div>
        {% endfor %}
    </div>
</div>
{% endblock %}
