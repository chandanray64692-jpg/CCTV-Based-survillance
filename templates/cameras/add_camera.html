{% extends 'core/base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <!-- Header -->
    <div class="flex justify-between items-center border-b border-gray-800 pb-4">
        <div>
            <h2 class="text-xl font-bold text-white tracking-wide">Add New Camera Node</h2>
            <p class="text-xs text-gray-400 mt-0.5">Configure RTSP stream or local webcam source for Tarkash AI engine.</p>
        </div>
        <a href="/cameras/manage/" class="text-xs text-gray-400 hover:text-white transition">Cancel</a>
    </div>

    <!-- Form Container -->
    <form method="POST" class="bg-[#161f1b] border border-gray-800 rounded-xl p-6 shadow-xl space-y-4">
        {% csrf_token %}
        
        <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1.5">Camera Name / Identifier</label>
            <input type="text" name="name" required placeholder="e.g., Main Gate Cam 01" class="w-full bg-[#111816] border border-gray-700 rounded-lg px-4 py-2 text-xs text-gray-200 focus:outline-none focus:border-emerald-500">
        </div>

        <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1.5">RTSP URL or Webcam Index</label>
            <input type="text" name="rtsp_url" required placeholder="e.g., rtsp://admin:pass@192.168.1.100:554/stream or 0 for laptop webcam" class="w-full bg-[#111816] border border-gray-700 rounded-lg px-4 py-2 text-xs text-gray-200 focus:outline-none focus:border-emerald-500 font-mono">
            <p class="text-[10px] text-gray-500 mt-1">Enter '0' or '1' if using your computer's built-in webcam.</p>
        </div>

        <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1.5">Zone / Location Category</label>
            <select name="zone_category" class="w-full bg-[#111816] border border-gray-700 rounded-lg px-4 py-2 text-xs text-gray-200 focus:outline-none focus:border-emerald-500">
                <option value="Headquarters">Headquarters</option>
                <option value="Perimeter Fence">Perimeter Fence</option>
                <option value="Main Gate">Main Gate</option>
                <option value="Server Room">Server Room</option>
            </select>
        </div>

        <div class="pt-4 border-t border-gray-800 flex justify-end gap-3">
            <a href="/cameras/manage/" class="bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs font-semibold py-2 px-4 rounded-lg transition">Cancel</a>
            <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-2 px-5 rounded-lg shadow-lg transition">Save & Initialize Node</button>
        </div>
    </form>
</div>
{% endblock %}
